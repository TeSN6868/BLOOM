name: Deploy BLOOM API

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout BLOOM
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler
        run: npm install -g wrangler@4.127.0

      - name: Create D1 if needed
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e

          DB_ID=$(wrangler d1 list --json | \
            node -e '
              let s="";
              process.stdin.on("data",d=>s+=d);
              process.stdin.on("end",()=>{
                const a=JSON.parse(s);
                const x=a.find(v=>v.name==="bloom-db");
                process.stdout.write(x ? x.uuid : "");
              });
            ')

          if [ -z "$DB_ID" ]; then
            echo "Creating bloom-db..."
            DB_ID=$(wrangler d1 create bloom-db --json | \
              node -e '
                let s="";
                process.stdin.on("data",d=>s+=d);
                process.stdin.on("end",()=>{
                  const x=JSON.parse(s);
                  process.stdout.write(x.database_id);
                });
              ')
          fi

          echo "D1_DATABASE_ID=$DB_ID" >> "$GITHUB_ENV"
          echo "D1 database ready."

      - name: Generate Wrangler config
        run: |
          cat > wrangler.jsonc <<EOF2
          {
            "\$schema": "node_modules/wrangler/config-schema.json",
            "name": "bloom-api",
            "main": "worker/index.js",
            "compatibility_date": "2026-08-28",
            "d1_databases": [
              {
                "binding": "DB",
                "database_name": "bloom-db",
                "database_id": "$D1_DATABASE_ID"
              }
            ]
          }
          EOF2

      - name: Initialize D1 schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler d1 execute bloom-db \
            --remote \
            --file=worker/schema.sql

      - name: Deploy BLOOM API
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler deploy

      - name: Show deployment
        run: |
          echo "===== BLOOM API DEPLOYED ====="
          echo "Database: bloom-db"
          echo "Worker: bloom-api"
